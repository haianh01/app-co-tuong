name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Kiểm tra kiểu
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit test + test tích hợp
        run: npm test

      - name: Build
        run: npx next build

      - name: Cài trình duyệt cho Playwright
        run: npx playwright install --with-deps chromium

      - name: Test giao diện (Playwright)
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
