<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Overlay AI trợ lý</title>
<style>
  /* Nền trong suốt để chồng lên stream trong OBS (Browser Source, rộng 600–800px). */
  html, body { margin: 0; background: transparent; font: 20px/1.45 system-ui, "Segoe UI", Roboto, sans-serif; }
  #box {
    margin: 12px; padding: 14px 18px; border-radius: 14px; color: #fff;
    background: rgba(15, 12, 10, .82); border-left: 5px solid #e0574d;
    opacity: 0; transform: translateY(8px); transition: opacity .3s, transform .3s;
  }
  #box.show { opacity: 1; transform: none; }
  .who { font-size: 14px; color: #ffcf6e; font-weight: 600; }
  .q { font-size: 15px; color: #d6d6d6; margin-top: 2px; }
  .a { margin-top: 6px; }
</style>
</head>
<body>
<div id="box"><div class="who">🤖 AI trợ lý</div><div class="q" id="q"></div><div class="a" id="a"></div></div>
<script src="/live-bot/speech.js"></script>
<script>
// Thêm ?voice=1 vào địa chỉ trong OBS để overlay tự đọc to (bật "Control audio via OBS" để chỉnh âm lượng).
const withVoice = new URLSearchParams(location.search).get("voice") === "1";
const speaker = window.createSpeaker();
function speak(text) {
  speaker.say(text);
}
const box = document.getElementById("box");
let hideTimer;
new EventSource("/api/bot/events").onmessage = (e) => {
  const r = JSON.parse(e.data);
  if (!r.reply) return;
  document.getElementById("q").textContent = r.origin === "game" ? "♟ Diễn biến ván" : "@" + r.user + ": " + r.question;
  document.getElementById("a").textContent = r.reply;
  box.classList.add("show");
  if (withVoice) speak(r.reply);
  clearTimeout(hideTimer);
  // Hiện lâu hơn với câu dài: khoảng 1 giây cho mỗi 3 từ, tối thiểu 6 giây.
  hideTimer = setTimeout(() => box.classList.remove("show"), Math.max(6000, r.reply.split(/\s+/).length * 330));
};
</script>
</body>
</html>
